name: ci

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: tty-pt/ci/.github/workflows/all-in-one.yml@main
    with:
      name: axil
      deps: "libcorm,libxylem,libssl-dev"
      deps_apk: "libcorm,libxylem,openssl-dev"
      deps_pacman: "libcorm,libxylem,openssl"
      deps_pacman_mingw: "mingw-w64-libcorm,mingw-w64-libxylem,mingw-w64-openssl,mingw-w64-libiconv"
      deps_rpm: "libcorm,libxylem,openssl-devel"
      deps_brew: "libcorm,libxylem,openssl"
      deps_openbsd: "libcorm,libxylem,openssl"
      deps_winget: "mingw-w64-x86_64-openssl,mingw-w64-x86_64-libiconv,mingw-w64-x86_64-xxhash"
      deps_winget_tty: "libstele,libcorm,libxylem"
      publish_to: "deb,apk,rpm,brew,openbsd,winget"
    secrets: inherit
